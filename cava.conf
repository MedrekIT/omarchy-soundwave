# Raw cava feed for the Soundwave plugin. One line per frame on stdout:
# 64 semicolon-separated levels in 0..100, low frequencies first.
[general]
framerate = 30
bars = 64
autosens = 1
sleep_timer = 0

[input]
method = pipewire
source = auto

[output]
method = raw
channels = mono
mono_option = average
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 70
